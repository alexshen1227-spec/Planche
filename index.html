    <script>
      // Apply theme before first paint to avoid a flash. The app mirrors its
      // theme setting into this dedicated key on every change.
      ;(function () {
        try {
          var t = localStorage.getItem('planchelab.theme') || 'dark'
          var dark = t === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches : t !== 'light'
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
